limit_req_zone $binary_remote_addr zone=soulforge_login:10m rate=5r/m;

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/soulforge/tls/dashboard.crt;
    ssl_certificate_key /etc/soulforge/tls/dashboard.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64k;
    proxy_connect_timeout 10s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    location = /admin/v1/session {
        limit_req zone=soulforge_login burst=3 nodelay;
        proxy_pass http://soul-service:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The game bridge talks directly to Soul Service on the private Compose
    # network. Do not publish its HMAC API through the LAN gateway.
    location /v1/ {
        return 404;
    }

    location / {
        proxy_pass http://soul-service:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
