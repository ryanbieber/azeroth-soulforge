name: azeroth-soulforge

x-ac-build: &ac-build
  context: ./runtime/source/azerothcore
  dockerfile: apps/docker/Dockerfile
  args:
    USER_ID: ${SOULFORGE_UID:-1000}
    GROUP_ID: ${SOULFORGE_GID:-1000}
    DOCKER_USER: acore

x-ac-databases: &ac-databases
  AC_LOGIN_DATABASE_INFO: ac-database;3306;root;${SOULFORGE_DB_ROOT_PASSWORD:?set SOULFORGE_DB_ROOT_PASSWORD in .env};acore_auth
  AC_WORLD_DATABASE_INFO: ac-database;3306;root;${SOULFORGE_DB_ROOT_PASSWORD};acore_world
  AC_CHARACTER_DATABASE_INFO: ac-database;3306;root;${SOULFORGE_DB_ROOT_PASSWORD};acore_characters

services:
  ac-database:
    image: mysql:8.4
    restart: unless-stopped
    # AzerothCore's world and Playerbots tables quickly outgrow MySQL's 128 MiB
    # default cache. This is a private, restartable game realm, so favor a
    # useful cache and once-per-second redo flushing over a disk sync for every
    # bot transaction. A host crash can lose at most the latest second of work.
    command:
      - --innodb-buffer-pool-size=${SOULFORGE_DB_BUFFER_POOL_SIZE:-4G}
      - --innodb-flush-log-at-trx-commit=2
      - --sync-binlog=0
    environment:
      MYSQL_ROOT_PASSWORD: ${SOULFORGE_DB_ROOT_PASSWORD}
    volumes:
      - ac-database:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --user=root --password=$$MYSQL_ROOT_PASSWORD --execute 'SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 40
    security_opt: [no-new-privileges:true]

  ac-db-import:
    image: azeroth-soulforge/db-import:local
    build:
      <<: *ac-build
      target: db-import
    environment:
      <<: *ac-databases
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
    volumes:
      - ./runtime/azerothcore/etc:/azerothcore/env/dist/etc
      - ./runtime/azerothcore/logs:/azerothcore/env/dist/logs
    depends_on:
      ac-database: {condition: service_healthy}

  ac-client-data-init:
    image: azeroth-soulforge/client-data:local
    build:
      <<: *ac-build
      target: client-data
    volumes:
      - ac-client-data:/azerothcore/env/dist/data

  ac-worldserver:
    image: azeroth-soulforge/worldserver:local
    build:
      <<: *ac-build
      target: worldserver
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      <<: *ac-databases
      AC_PLAYERBOTS_DATABASE_INFO: ac-database;3306;root;${SOULFORGE_DB_ROOT_PASSWORD};acore_playerbots
      AC_DATA_DIR: /azerothcore/env/dist/data
      AC_LOGS_DIR: /azerothcore/env/dist/logs
      AC_UPDATES_ENABLE_DATABASES: 7
      AC_SOUL_BRIDGE_ENABLED: 1
      AC_SOUL_BRIDGE_SERVICE_HOST: soul-service
      AC_SOUL_BRIDGE_SERVICE_PORT: 8765
      AC_SOUL_BRIDGE_REALM_ID: azeroth-soulforge
      AC_SOUL_BRIDGE_SHARED_SECRET: ${SOULFORGE_BRIDGE_SECRET:?set SOULFORGE_BRIDGE_SECRET in .env}
      AC_SOAP_ENABLED: 1
      AC_SOAP_IP: 0.0.0.0
      AC_SOAP_PORT: 7878
    ports:
      - "${SOULFORGE_BIND_ADDRESS:-0.0.0.0}:8085:8085"
      - "127.0.0.1:7878:7878"
    volumes:
      - ./runtime/azerothcore/etc:/azerothcore/env/dist/etc
      - ./runtime/azerothcore/logs:/azerothcore/env/dist/logs
      - ./runtime/source/azerothcore/modules/mod-playerbots/data/sql:/azerothcore/modules/mod-playerbots/data/sql:ro
      - ac-client-data:/azerothcore/env/dist/data:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8085'"]
      interval: 5s
      timeout: 3s
      retries: 180
      start_period: 30s
    depends_on:
      ac-database: {condition: service_healthy}
      ac-db-import: {condition: service_completed_successfully}
      ac-client-data-init: {condition: service_completed_successfully}
      soul-service: {condition: service_healthy}

  ac-authserver:
    image: azeroth-soulforge/authserver:local
    build:
      <<: *ac-build
      target: authserver
    restart: unless-stopped
    tty: true
    environment:
      AC_LOGIN_DATABASE_INFO: ac-database;3306;root;${SOULFORGE_DB_ROOT_PASSWORD};acore_auth
      AC_LOGS_DIR: /azerothcore/env/dist/logs
    ports:
      - "${SOULFORGE_BIND_ADDRESS:-0.0.0.0}:3724:3724"
    volumes:
      - ./runtime/azerothcore/etc:/azerothcore/env/dist/etc
      - ./runtime/azerothcore/logs:/azerothcore/env/dist/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3724'"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    depends_on:
      ac-database: {condition: service_healthy}
      ac-db-import: {condition: service_completed_successfully}

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.33.0}
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]

  control-agent:
    build: ./control-agent
    restart: unless-stopped
    environment:
      SOULFORGE_CONTROL_SECRET: ${SOULFORGE_CONTROL_SECRET:?set SOULFORGE_CONTROL_SECRET in .env}
      SOULFORGE_DB_ROOT_PASSWORD: ${SOULFORGE_DB_ROOT_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime/azerothcore/etc:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8770/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  soul-service:
    build:
      context: .
      dockerfile: soul-service/Dockerfile
    restart: unless-stopped
    depends_on:
      ollama: {condition: service_healthy}
      control-agent: {condition: service_healthy}
    environment:
      SOULFORGE_HOST: 0.0.0.0
      SOULFORGE_PORT: 8765
      SOULFORGE_DATABASE: /data/soulforge.sqlite3
      SOULFORGE_OLLAMA_URL: http://ollama:11434
      SOULFORGE_CHAT_MODEL: ${SOULFORGE_CHAT_MODEL:-qwen3.5:4b}
      SOULFORGE_AMBIENT_MODEL: ${SOULFORGE_AMBIENT_MODEL:-qwen3:1.7b}
      SOULFORGE_BRIDGE_SECRET: ${SOULFORGE_BRIDGE_SECRET}
      SOULFORGE_ADMIN_PASSWORD: ${SOULFORGE_ADMIN_PASSWORD:?set SOULFORGE_ADMIN_PASSWORD in .env}
      SOULFORGE_CONTROL_SECRET: ${SOULFORGE_CONTROL_SECRET}
      SOULFORGE_SECRETS_KEY: ${SOULFORGE_SECRETS_KEY:?set SOULFORGE_SECRETS_KEY in .env}
      SOULFORGE_CONTROL_URL: http://control-agent:8770
      SOULFORGE_OPENAI_API_KEY: ${SOULFORGE_OPENAI_API_KEY:-}
      SOULFORGE_OPENAI_BASE_URL: ${SOULFORGE_OPENAI_BASE_URL:-https://api.openai.com}
      SOULFORGE_OPENAI_MODEL: ${SOULFORGE_OPENAI_MODEL:-gpt-5.6-luna}
      SOULFORGE_CONSOLEPORT_ARCHIVE: /client-addons/ConsolePortLK-1.5.0-rc2.zip
      SOULFORGE_WOWMAPPERX_ARCHIVE: /client-addons/WoWmapperX-1.1.0-x86-aot.zip
    volumes:
      - soul-data:/data
      - ./runtime/client-addons/ConsolePortLK-1.5.0-rc2.zip:/client-addons/ConsolePortLK-1.5.0-rc2.zip:ro
      - ./runtime/client-addons/WoWmapperX-1.1.0-x86-aot.zip:/client-addons/WoWmapperX-1.1.0-x86-aot.zip:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  soulforge-gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      soul-service: {condition: service_healthy}
    ports:
      - "${SOULFORGE_BIND_ADDRESS:-0.0.0.0}:${SOULFORGE_DASHBOARD_PORT:-8765}:8443"
    volumes:
      - ./config/nginx-soulforge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.run/tls:/etc/soulforge/tls:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]

volumes:
  ac-database:
  ac-client-data:
  ollama-data:
  soul-data:
