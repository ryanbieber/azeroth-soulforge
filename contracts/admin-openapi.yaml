openapi: 3.1.0
info:
  title: Azeroth Soulforge Administration API
  version: 1.0.0
  description: |
    Same-origin API used by the trusted-LAN React control plane. Except for
    login, requests require the Secure, HttpOnly `soulforge_session` cookie.
    Mutations also require the session's `X-CSRF-Token` value. This API never
    returns bridge, control, Docker, database, or game-account credentials.
servers:
  - url: https://127.0.0.1:8765/admin/v1
security:
  - adminSession: []
paths:
  /home:
    get:
      summary: Return the active world, human presence, AI usage, companions, rumors, and service state
      responses: {"200": {description: Home dashboard snapshot}}
  /world:
    get:
      summary: Return the active immutable prompted world
      responses: {"200": {description: Active world or null}}
  /world/forge:
    post:
      summary: Queue fresh-world canon and dungeon-group generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seed_prompt, faction, player_role]
              properties:
                seed_prompt: {type: string, minLength: 20, maxLength: 12000}
                faction: {type: string, enum: [alliance, horde]}
                player_role: {type: string, enum: [tank, healer, dps]}
      responses: {"202": {description: Forge job queued}, "400": {description: Invalid or active world}}
  /world/chronicle:
    get:
      summary: Return append-only memories for the active world
      responses: {"200": {description: World memories}}
  /world/rumors:
    get:
      summary: Return spoiler-free hints for planned narrative events
      responses: {"200": {description: Rumors and tensions}}
  /world/social:
    get:
      summary: Return bounded companion moods, relationships, latest session reflection, and callback threads
      responses: {"200": {description: Social continuity state for the active world}}
  /world/companions:
    get:
      summary: Return deep-memory companions bound to the active world
      responses: {"200": {description: Companion party}}
    post:
      summary: Promote an existing Playerbot to a deep-memory companion
      responses: {"201": {description: Companion promoted}}
  /world/companions/{bot_guid}/prompt:
    get:
      summary: Preview the authenticated companion chat prompt and its bounded context
      parameters:
        - {name: bot_guid, in: path, required: true, schema: {type: string, pattern: "^[1-9][0-9]{0,19}$"}}
      responses: {"200": {description: Assembled prompt preview}, "404": {description: Unknown companion}}
  /world/actions/{action}:
    post:
      summary: Enter or leave the persistent world
      parameters:
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [enter, leave]}
      responses: {"200": {description: Game service action completed}}
  /jobs/{job_id}:
    get:
      summary: Inspect an asynchronous generation job
      parameters:
        - {name: job_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses: {"200": {description: Job state}, "404": {description: Unknown job}}
  /ai/providers:
    get:
      summary: List AI provider profiles without returning credentials
      responses: {"200": {description: Provider profiles}}
    post:
      summary: Add or replace a local or paid AI provider profile
      responses: {"201": {description: Provider saved}}
  /ai/providers/{provider_id}/test:
    post:
      summary: Test one provider and model using its server-side credential
      parameters:
        - {name: provider_id, in: path, required: true, schema: {type: string}}
      responses: {"200": {description: Provider connected}, "400": {description: Test failed}}
  /ai/routing:
    get:
      summary: Return separate director, companion-dialogue, ambient-bot, and local social-instinct model routes
      responses: {"200": {description: AI routes}}
    put:
      summary: Replace director, companion-dialogue, ambient-bot, and local social-instinct model routes
      responses: {"200": {description: AI routes saved}}
  /ai/state:
    get:
      summary: Return global safeguards plus ambient reply probability and cooldown
      responses: {"200": {description: AI safeguards}}
    put:
      summary: Update global safeguards or ambient reply controls
      responses: {"200": {description: AI safeguards saved}}
  /ai/usage:
    get:
      summary: Return normalized monthly totals, estimated spend, and a 24-hour hourly token series
      responses: {"200": {description: Monthly AI usage}}
  /addons:
    get:
      summary: Return client-pack readiness, pinned addon and controller-mapper versions, and install paths
      responses:
        "200":
          description: Client-addon pack metadata; readiness describes the server package, not client installation
  /addon/download:
    get:
      summary: Download pinned ConsolePortLK, Soulforge Commander, and legacy WoWmapperX controller files
      responses:
        "200":
          description: WoW 3.3.5a multi-addon ZIP
          content: {application/zip: {schema: {type: string, format: binary}}}
        "503": {description: A pinned client component or Soulforge Commander source is unavailable}
  /session:
    get:
      summary: Inspect the current authenticated session
      responses:
        "200": {description: Authenticated session and CSRF token}
        "401": {description: Authentication required}
    post:
      security: []
      summary: Create a rate-limited admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties: {password: {type: string, minLength: 12, maxLength: 256}}
      responses:
        "200": {description: Session created}
        "401": {description: Invalid credentials}
        "429": {description: Too many attempts}
    delete:
      summary: End the current session
      responses: {"204": {description: Session ended}}
  /souls:
    get:
      summary: List forged souls
      responses: {"200": {description: Soul profiles and memory counts}}
    post:
      summary: Forge a soul for an immutable realm/GUID identity
      responses: {"201": {description: Soul forged or already present}}
  /souls/{realm_id}/{bot_guid}:
    patch:
      summary: Edit or pause one soul profile
      parameters:
        - {$ref: "#/components/parameters/Realm"}
        - {$ref: "#/components/parameters/Guid"}
      responses: {"200": {description: Profile saved}, "404": {description: Unknown soul}}
  /souls/{realm_id}/{bot_guid}/memories:
    get:
      summary: List recent memories for one soul
      parameters:
        - {$ref: "#/components/parameters/Realm"}
        - {$ref: "#/components/parameters/Guid"}
      responses: {"200": {description: Memories}}
  /souls/{realm_id}/{bot_guid}/skill:
    get:
      summary: Read the owner-editable character SKILL.md section
      parameters:
        - {$ref: "#/components/parameters/Realm"}
        - {$ref: "#/components/parameters/Guid"}
      responses: {"200": {description: Character skill guidance}}
    put:
      summary: Replace the owner-editable character SKILL.md section
      parameters:
        - {$ref: "#/components/parameters/Realm"}
        - {$ref: "#/components/parameters/Guid"}
      responses: {"200": {description: Character skill saved}}
  /souls/{realm_id}/{bot_guid}/memories/{memory_id}:
    delete:
      summary: Permanently delete an incorrect memory
      parameters:
        - {$ref: "#/components/parameters/Realm"}
        - {$ref: "#/components/parameters/Guid"}
        - {name: memory_id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses: {"204": {description: Memory deleted}, "404": {description: Unknown memory}}
  /bots:
    get:
      summary: List Playerbots, flagging player-added companions separately from random world bots
      responses: {"200": {description: Playerbot roster}}
  /auction-house/characters:
    get:
      summary: List non-Playerbot characters eligible for dedicated auction-house duty
      responses: {"200": {description: Eligible character roster}}
  /server/status:
    get:
      summary: Return allowlisted stack status
      responses: {"200": {description: Service states}}
  /server/actions/{action}:
    post:
      summary: Start, stop, or restart only the game servers
      parameters:
        - name: action
          in: path
          required: true
          schema: {type: string, enum: [start, stop, restart]}
      responses: {"200": {description: Action completed}}
  /server/settings:
    get:
      summary: Return non-secret adjustable settings
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ServerSettings"}
    put:
      summary: Validate and apply non-secret adjustable settings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ServerSettingsUpdate"}
      responses: {"200": {description: Settings applied}}
  /models:
    get:
      summary: List locally installed Ollama models
      responses: {"200": {description: Installed and active models}}
  /models/pull:
    post:
      summary: Install an Ollama model by tag
      responses: {"200": {description: Model installed}}
components:
  schemas:
    ServerSettingsUpdate:
      type: object
      properties:
        realm_name: {type: string, minLength: 1, maxLength: 32}
        realm_type: {type: string, enum: [normal, pvp, rp, rp_pvp]}
        random_bots: {type: integer, minimum: 0, maximum: 2000}
        max_added_bots: {type: integer, minimum: 1, maximum: 80}
        new_character_level: {type: integer, minimum: 1, maximum: 80, description: Starting level for newly created normal and heroic characters; does not modify existing characters.}
        player_limit: {type: integer, minimum: 1, maximum: 1000}
        xp_rate: {type: number, minimum: 0.1, maximum: 10}
        reputation_rate: {type: number, minimum: 0.1, maximum: 10}
        loot_rate: {type: number, minimum: 0.1, maximum: 10}
        money_rate: {type: number, minimum: 0.1, maximum: 10}
        honor_rate: {type: number, minimum: 0.1, maximum: 10}
        profession_skill_rate: {type: integer, minimum: 1, maximum: 10}
        auction_house_character_guid: {type: string, pattern: "^(0|[1-9][0-9]{0,9})$"}
        auction_house_seller: {type: boolean}
        auction_house_buyer: {type: boolean}
        auction_house_items_per_cycle: {type: integer, minimum: 1, maximum: 1000}
        chat_model: {type: string}
        souls_enabled: {type: boolean}
        temperature: {type: number, minimum: 0, maximum: 2}
        max_tokens: {type: integer, minimum: 32, maximum: 512}
      additionalProperties: false
    ServerSettings:
      allOf:
        - {$ref: "#/components/schemas/ServerSettingsUpdate"}
        - type: object
          required: [realm_name, realm_type, random_bots, max_added_bots, new_character_level, player_limit, xp_rate, reputation_rate, loot_rate, money_rate, honor_rate, profession_skill_rate, auction_house_character_guid, auction_house_seller, auction_house_buyer, auction_house_items_per_cycle, chat_model, souls_enabled, temperature, max_tokens]
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: soulforge_session
  parameters:
    Realm:
      name: realm_id
      in: path
      required: true
      schema: {type: string, pattern: "^[A-Za-z0-9._-]{1,64}$"}
    Guid:
      name: bot_guid
      in: path
      required: true
      schema: {type: string, pattern: "^[1-9][0-9]{0,19}$"}
