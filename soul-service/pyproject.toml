[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azeroth-soulforge"
version = "0.1.0"
description = "Local persistent social intelligence for AzerothCore Playerbots"
requires-python = ">=3.11"
license = {text = "GPL-2.0-only"}
authors = [{name = "Azeroth Soulforge contributors"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
